unbind r
bind r source-file ~/.tmux.conf
bind c new-window -c "#{pane_current_path}"

set -g prefix C-s

bind | split-window -h
bind - split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g @plugin 'tmux-plugins/tpm'

# Previous theme: egel/tmux-gruvbox
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark256'

# Ayu Dark theme
set -g status-style bg=#0A0E14,fg=#B3B1AD
set -g status-left-style bg=#0A0E14,fg=#53BDFA,bold
set -g status-right-style bg=#0A0E14,fg=#91B362
set -g status-left-length 80
set -g status-right-length 100
set -g status-justify left
set -g status-left "#[fg=#0A0E14,bg=#53BDFA,bold] #S #[fg=#53BDFA,bg=#0A0E14,nobold,noitalics,nounderscore] "
set -g status-right "#[fg=#1F2430,bg=#0A0E14,nobold,noitalics,nounderscore]#[fg=#B3B1AD,bg=#1F2430] %Y-%m-%d #[fg=#686868] #[fg=#FFB454]%H:%M #[fg=#53BDFA,bg=#1F2430,nobold,noitalics,nounderscore]#[fg=#0A0E14,bg=#53BDFA,bold] #h "
set -g window-status-separator ""
set -g window-status-style bg=#0A0E14,fg=#686868
set -g window-status-current-style bg=#FFB454,fg=#0A0E14,bold
set -g window-status-activity-style bg=#0A0E14,fg=#91B362
set -g window-status-bell-style bg=#EA6C73,fg=#0A0E14,bold
set -g window-status-format "#[fg=#686868,bg=#0A0E14] #I #[fg=#B3B1AD]#W#{?window_flags, #[fg=#686868]#F,} "
set -g window-status-current-format "#[fg=#0A0E14,bg=#FFB454,bold] #I #[fg=#0A0E14,bg=#FFB454,bold]#W#{?window_zoomed_flag, Z,} "
set -g pane-border-style fg=#1F2430
set -g pane-active-border-style fg=#53BDFA
set -g message-style bg=#1F2430,fg=#FFB454
set -g mode-style bg=#FFB454,fg=#0A0E14

set-option -g status-position bottom
# set-option -g default-shell /bin/bash
set-option -g escape-time 0
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

setw -g mode-keys vi

run -b '~/.tmux/plugins/tpm/tpm'

# on errors with tpm run: bash ~/.tmux/plugins/tpm/tpm
